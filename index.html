<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale=1.0">
    <title>test</title>
    <style>
      @import url('https://googleapis');

      body {
        background-color:  #0d0e15;
        color: #00ffcc;
        font-family: 'Fira Code', monospace;
        padding: 40px;
        display: flex;
        justify-content: center;
        aling-items: center;
        height: 100vh;
        margin: 0;
      }

      .terminal-box {
        border: 2px solid #ff0055;
        box-shadow: 0 0 20px #ff0055;
        background-color: #1a1c23;
        padding: 30px;
        border-radius: 8px;
        max-width: 500px;
        width: 100%;
      }

      h1 {
        color: #ff0055;
        font-size: 2.5rem;
        margin-top: 0;
        text-shadow: 0 0 10px #ff0055;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.6;
        color: #00ffcc;
      }

      .status {
        color: #ff0055;
        font-weight: bold;
      }

      
    </style>
  </head>

    <div class="terminal-box">
        <h1>test</h1>
